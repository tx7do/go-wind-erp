syntax = "proto3";

package inventory.service.v1;

import "gnostic/openapi/v3/annotations.proto";

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";

import "pagination/v1/pagination.proto";

// 仓库管理服务
service WarehouseService {
  // 查询仓库列表
  rpc List (pagination.PagingRequest) returns (ListWarehouseResponse) {}

  // 统计仓库数量
  rpc Count (pagination.PagingRequest) returns (CountWarehouseResponse) {}

  // 查询仓库详情
  rpc Get (GetWarehouseRequest) returns (Warehouse) {}

  // 创建仓库
  rpc Create (CreateWarehouseRequest) returns (google.protobuf.Empty) {}

  // 更新仓库
  rpc Update (UpdateWarehouseRequest) returns (google.protobuf.Empty) {}

  // 删除仓库
  rpc Delete (DeleteWarehouseRequest) returns (google.protobuf.Empty) {}
}

// 库存位置服务（借鉴 Odoo stock.location 的 usage 概念，简化为扁平结构）
service LocationService {
  // 查询位置列表
  rpc List (pagination.PagingRequest) returns (ListLocationResponse) {}

  // 统计位置数量
  rpc Count (pagination.PagingRequest) returns (CountLocationResponse) {}

  // 查询位置详情
  rpc Get (GetLocationRequest) returns (StockLocation) {}

  // 创建位置
  rpc Create (CreateLocationRequest) returns (google.protobuf.Empty) {}

  // 更新位置
  rpc Update (UpdateLocationRequest) returns (google.protobuf.Empty) {}

  // 删除位置
  rpc Delete (DeleteLocationRequest) returns (google.protobuf.Empty) {}
}

// 库存量服务（借鉴 Odoo stock.quant，只读——quantity 仅由拣货校验变更）
service StockQuantService {
  // 查询库存量列表
  rpc List (pagination.PagingRequest) returns (ListStockQuantResponse) {}

  // 统计库存量行数
  rpc Count (pagination.PagingRequest) returns (CountStockQuantResponse) {}

  // 查询库存量详情
  rpc Get (GetStockQuantRequest) returns (StockQuant) {}

  // 库存经营总览（看板聚合：仓库数/SKU数/库存总量/低库存清单）
  rpc GetOverview (GetStockQuantOverviewRequest) returns (StockQuantOverview) {}

  // 库存流水趋势（近 30 日每日执行记录条数，用于看板折线图）
  rpc GetMovementTrend (GetMovementTrendRequest) returns (MovementTrendResponse) {}
}

// 拣货单服务（借鉴 Odoo stock.picking：一等文档，有生命周期）
service StockPickingService {
  // 查询拣货单列表
  rpc List (pagination.PagingRequest) returns (ListStockPickingResponse) {}

  // 统计拣货单数量
  rpc Count (pagination.PagingRequest) returns (CountStockPickingResponse) {}

  // 查询拣货单详情（含 moves）
  rpc Get (GetStockPickingRequest) returns (StockPicking) {}

  // 创建拣货单（含嵌套 moves；type=INTERNAL 调拨，客户端提供明细）
  rpc Create (CreateStockPickingRequest) returns (google.protobuf.Empty) {}

  // 确认拣货单（DRAFT moves → CONFIRMED，借鉴 Odoo action_confirm）
  rpc Confirm (ConfirmStockPickingRequest) returns (google.protobuf.Empty) {}

  // 校验拣货单（CONFIRMED moves → DONE，事务内创建 move-lines、更新 quants；
  // 借鉴 Odoo button_validate / _action_done）
  rpc Validate (ValidateStockPickingRequest) returns (google.protobuf.Empty) {}

  // 取消拣货单（非终态 moves → CANCELLED）
  rpc Cancel (CancelStockPickingRequest) returns (google.protobuf.Empty) {}

  // 删除拣货单（DRAFT/CANCELLED）
  rpc Delete (DeleteStockPickingRequest) returns (google.protobuf.Empty) {}
}

// 仓库
message Warehouse {
  optional uint32 id = 1 [
    json_name = "id",
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      description: "仓库ID"
    }
  ]; // 仓库ID

  optional string code = 2 [
    json_name = "code",
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      description: "仓库编码，租户范围内唯一"
    }
  ]; // 仓库编码

  optional string name = 3 [
    json_name = "name",
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      description: "仓库名称"
    }
  ]; // 仓库名称

  optional string location = 4 [
    json_name = "location",
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      description: "仓库地址"
    }
  ]; // 仓库地址

  // receiving_location_id：该仓库的内部接收位置（仓库创建时自动生成的
  // INTERNAL StockLocation）。入库拣货单的目的位置即取自此字段。
  optional uint32 receiving_location_id = 5 [
    json_name = "receivingLocationId",
    (gnostic.openapi.v3.property) = {description: "接收位置ID（系统生成）"}
  ]; // 接收位置ID

  optional bool enable = 10 [
    json_name = "enable",
    (gnostic.openapi.v3.property) = {
      description: "启用/禁用仓库"
    }
  ]; // 启用/禁用仓库

  optional string remark = 11 [
    json_name = "remark",
    (gnostic.openapi.v3.property) = {description: "备注"}
  ]; // 备注

  optional uint32 tenant_id = 20 [
    json_name = "tenantId",
    (gnostic.openapi.v3.property) = {description: "租户ID，0代表系统全局"}
  ];  // 租户ID，0代表系统全局

  optional uint32 created_by = 100 [json_name = "createdBy", (gnostic.openapi.v3.property) = {description: "创建者用户ID"}]; // 创建者用户ID
  optional uint32 updated_by = 101 [json_name = "updatedBy", (gnostic.openapi.v3.property) = {description: "更新者用户ID"}]; // 更新者用户ID
  optional uint32 deleted_by = 102 [json_name = "deletedBy", (gnostic.openapi.v3.property) = {description: "删除者用户ID"}]; // 删除者用户ID

  optional google.protobuf.Timestamp created_at = 200 [json_name = "createdAt", (gnostic.openapi.v3.property) = {description: "创建时间"}];// 创建时间
  optional google.protobuf.Timestamp updated_at = 201 [json_name = "updatedAt", (gnostic.openapi.v3.property) = {description: "更新时间"}];// 更新时间
  optional google.protobuf.Timestamp deleted_at = 202 [json_name = "deletedAt", (gnostic.openapi.v3.property) = {description: "删除时间"}];// 删除时间
}

// 库存位置（借鉴 Odoo stock.location，简化为扁平结构）
message StockLocation {
  // 位置用途（借鉴 Odoo stock.location.usage，驱动移动语义）
  enum Usage {
    INTERNAL = 0; // 内部仓库位置（dest for incoming, src/dst for internal）
    SUPPLIER = 1; // 供应商位置（src for incoming）
  }

  optional uint32 id = 1 [
    json_name = "id",
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      description: "位置ID"
    }
  ]; // 位置ID

  optional string name = 2 [
    json_name = "name",
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      description: "位置名称"
    }
  ]; // 位置名称

  optional Usage usage = 3 [
    json_name = "usage",
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
          description: "位置用途"
        }
  ]; // 位置用途

  optional string warehouse_code = 4 [
    json_name = "warehouseCode",
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
          description: "归属仓库编码（仅 INTERNAL 位置）"
        }
  ]; // 归属仓库编码

  optional string remark = 11 [
    json_name = "remark",
    (gnostic.openapi.v3.property) = {description: "备注"}
  ]; // 备注

  optional uint32 tenant_id = 20 [
    json_name = "tenantId",
    (gnostic.openapi.v3.property) = {description: "租户ID，0代表系统全局"}
  ];  // 租户ID，0代表系统全局

  optional uint32 created_by = 100 [json_name = "createdBy", (gnostic.openapi.v3.property) = {description: "创建者用户ID"}]; // 创建者用户ID
  optional uint32 updated_by = 101 [json_name = "updatedBy", (gnostic.openapi.v3.property) = {description: "更新者用户ID"}]; // 更新者用户ID
  optional uint32 deleted_by = 102 [json_name = "deletedBy", (gnostic.openapi.v3.property) = {description: "删除者用户ID"}]; // 删除者用户ID

  optional google.protobuf.Timestamp created_at = 200 [json_name = "createdAt", (gnostic.openapi.v3.property) = {description: "创建时间"}];// 创建时间
  optional google.protobuf.Timestamp updated_at = 201 [json_name = "updatedAt", (gnostic.openapi.v3.property) = {description: "更新时间"}];// 更新时间
  optional google.protobuf.Timestamp deleted_at = 202 [json_name = "deletedAt", (gnostic.openapi.v3.property) = {description: "删除时间"}];// 删除时间
}

// 库存量（借鉴 Odoo stock.quant，只读——quantity 仅由拣货校验变更）
message StockQuant {
  optional uint32 id = 1 [
    json_name = "id",
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      description: "库存量ID"
    }
  ]; // 库存量ID

  optional uint32 location_id = 2 [
    json_name = "locationId",
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
          description: "所在位置ID"
        }
  ]; // 所在位置ID

  optional string product_code = 3 [
    json_name = "productCode",
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
          description: "产品编码"
        }
  ]; // 产品编码

  optional int64 quantity = 4 [
    json_name = "quantity",
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
          description: "在手数量"
        }
  ]; // 在手数量

  optional string remark = 11 [
    json_name = "remark",
    (gnostic.openapi.v3.property) = {description: "备注"}
  ]; // 备注

  optional uint32 tenant_id = 20 [
    json_name = "tenantId",
    (gnostic.openapi.v3.property) = {description: "租户ID，0代表系统全局"}
  ];  // 租户ID，0代表系统全局

  optional uint32 created_by = 100 [json_name = "createdBy", (gnostic.openapi.v3.property) = {description: "创建者用户ID"}]; // 创建者用户ID
  optional uint32 updated_by = 101 [json_name = "updatedBy", (gnostic.openapi.v3.property) = {description: "更新者用户ID"}]; // 更新者用户ID
  optional uint32 deleted_by = 102 [json_name = "deletedBy", (gnostic.openapi.v3.property) = {description: "删除者用户ID"}]; // 删除者用户ID

  optional google.protobuf.Timestamp created_at = 200 [json_name = "createdAt", (gnostic.openapi.v3.property) = {description: "创建时间"}];// 创建时间
  optional google.protobuf.Timestamp updated_at = 201 [json_name = "updatedAt", (gnostic.openapi.v3.property) = {description: "更新时间"}];// 更新时间
  optional google.protobuf.Timestamp deleted_at = 202 [json_name = "deletedAt", (gnostic.openapi.v3.property) = {description: "删除时间"}];// 删除时间
}

// 拣货单（借鉴 Odoo stock.picking：一等文档，生命周期从子 moves 派生）
message StockPicking {
  // 拣货类型（借鉴 Odoo picking_type.code，简化为枚举）
  enum PickingType {
    INCOMING = 0; // 入库（SUPPLIER→INTERNAL）
    INTERNAL = 1; // 调拨（INTERNAL→INTERNAL）
  }

  // 派生态（从子 moves 聚合，不存储——借鉴 Odoo _compute_state）
  enum DerivedState {
    DRAFT = 0;      // 有任何 DRAFT move
    CONFIRMED = 1;  // 有 CONFIRMED move
    DONE = 2;       // 全部 DONE
    CANCELLED = 3;  // 全部 CANCELLED
  }

  optional uint32 id = 1 [
    json_name = "id",
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      description: "拣货单ID"
    }
  ]; // 拣货单ID

  optional string picking_number = 2 [
    json_name = "pickingNumber",
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      description: "拣货单号（服务端生成）"
    }
  ]; // 拣货单号

  optional PickingType picking_type = 3 [
    json_name = "pickingType",
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
          description: "拣货类型"
        }
  ]; // 拣货类型

  // derived_state：从子 moves 聚合计算，不存储（借鉴 Odoo _compute_state）。
  optional DerivedState derived_state = 4 [
    json_name = "derivedState",
    (gnostic.openapi.v3.property) = {description: "派生态（从子 moves 聚合，不存储）"}
  ]; // 派生态

  optional uint32 purchase_order_id = 5 [
    json_name = "purchaseOrderId",
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
          description: "关联采购单ID（仅入库）"
        }
  ]; // 关联采购单ID

  optional string partner_code = 6 [
    json_name = "partnerCode",
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
          description: "交易方编码"
        }
  ]; // 交易方编码

  // source/dest location：由服务层按 picking_type + 仓库推导落库（客户端不提供）。
  optional uint32 source_location_id = 9 [
    json_name = "sourceLocationId",
    (gnostic.openapi.v3.property) = {description: "源位置ID（服务端推导）"}
  ]; // 源位置ID（服务端推导，不存储客户端传值）

  optional uint32 destination_location_id = 10 [
    json_name = "destinationLocationId",
    (gnostic.openapi.v3.property) = {description: "目的位置ID（服务端推导）"}
  ]; // 目的位置ID（服务端推导，不存储客户端传值）

  // moves：子移动计划（Get 返回；Create 时客户端提供）。
  repeated StockMove moves = 7 [
    json_name = "moves",
    (gnostic.openapi.v3.property) = {description: "子移动计划列表"}
  ]; // 子移动计划列表

  optional string remark = 11 [
    json_name = "remark",
    (gnostic.openapi.v3.property) = {description: "备注"}
  ]; // 备注

  optional uint32 tenant_id = 20 [
    json_name = "tenantId",
    (gnostic.openapi.v3.property) = {description: "租户ID，0代表系统全局"}
  ];  // 租户ID，0代表系统全局

  optional uint32 created_by = 100 [json_name = "createdBy", (gnostic.openapi.v3.property) = {description: "创建者用户ID"}]; // 创建者用户ID
  optional uint32 updated_by = 101 [json_name = "updatedBy", (gnostic.openapi.v3.property) = {description: "更新者用户ID"}]; // 更新者用户ID
  optional uint32 deleted_by = 102 [json_name = "deletedBy", (gnostic.openapi.v3.property) = {description: "删除者用户ID"}]; // 删除者用户ID

  optional google.protobuf.Timestamp created_at = 200 [json_name = "createdAt", (gnostic.openapi.v3.property) = {description: "创建时间"}];// 创建时间
  optional google.protobuf.Timestamp updated_at = 201 [json_name = "updatedAt", (gnostic.openapi.v3.property) = {description: "更新时间"}];// 更新时间
  optional google.protobuf.Timestamp deleted_at = 202 [json_name = "deletedAt", (gnostic.openapi.v3.property) = {description: "删除时间"}];// 删除时间
}

// 库存移动计划（借鉴 Odoo stock.move 的计划角色）
message StockMove {
  // 移动状态机（DRAFT→CONFIRMED→DONE/CANCELLED）
  enum State {
    DRAFT = 0;      // 草稿
    CONFIRMED = 1;  // 已确认
    DONE = 2;       // 已完成
    CANCELLED = 3;  // 已取消
  }

  optional uint32 id = 1 [
    json_name = "id",
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      description: "移动ID"
    }
  ]; // 移动ID

  optional uint32 picking_id = 2 [
    json_name = "pickingId",
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
          description: "所属拣货单ID"
        }
  ]; // 所属拣货单ID

  optional string product_code = 3 [
    json_name = "productCode",
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
          description: "产品编码"
        }
  ]; // 产品编码

  optional uint32 source_location_id = 4 [
    json_name = "sourceLocationId",
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
          description: "源位置ID"
        }
  ]; // 源位置ID

  optional uint32 destination_location_id = 5 [
    json_name = "destinationLocationId",
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
          description: "目的位置ID"
        }
  ]; // 目的位置ID

  optional int64 planned_quantity = 6 [
    json_name = "plannedQuantity",
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
          description: "计划数量"
        }
  ]; // 计划数量

  optional State state = 7 [
    json_name = "state",
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
          description: "移动状态"
        }
  ]; // 移动状态

  optional uint32 purchase_order_item_id = 8 [
    json_name = "purchaseOrderItemId",
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
          description: "关联采购明细ID（仅入库）"
        }
  ]; // 关联采购明细ID

  optional string remark = 11 [
    json_name = "remark",
    (gnostic.openapi.v3.property) = {description: "备注"}
  ]; // 备注

  optional uint32 tenant_id = 20 [
    json_name = "tenantId",
    (gnostic.openapi.v3.property) = {description: "租户ID，0代表系统全局"}
  ];  // 租户ID，0代表系统全局

  optional uint32 created_by = 100 [json_name = "createdBy", (gnostic.openapi.v3.property) = {description: "创建者用户ID"}]; // 创建者用户ID
  optional uint32 updated_by = 101 [json_name = "updatedBy", (gnostic.openapi.v3.property) = {description: "更新者用户ID"}]; // 更新者用户ID
  optional uint32 deleted_by = 102 [json_name = "deletedBy", (gnostic.openapi.v3.property) = {description: "删除者用户ID"}]; // 删除者用户ID

  optional google.protobuf.Timestamp created_at = 200 [json_name = "createdAt", (gnostic.openapi.v3.property) = {description: "创建时间"}];// 创建时间
  optional google.protobuf.Timestamp updated_at = 201 [json_name = "updatedAt", (gnostic.openapi.v3.property) = {description: "更新时间"}];// 更新时间
  optional google.protobuf.Timestamp deleted_at = 202 [json_name = "deletedAt", (gnostic.openapi.v3.property) = {description: "删除时间"}];// 删除时间
}

// 查询仓库列表 - 回应
message ListWarehouseResponse {
  repeated Warehouse items = 1;
  uint64 total = 2;
}

// 查询仓库详情 - 请求
message GetWarehouseRequest {
  oneof query_by {
    uint32 id = 1 [
      (gnostic.openapi.v3.property) = {description: "ID", read_only: true},
      json_name = "id"
    ]; // ID
  }

  optional google.protobuf.FieldMask view_mask = 100 [
    json_name = "viewMask",
    (gnostic.openapi.v3.property) = {
          description: "视图字段过滤器，用于控制返回的字段"
        }
  ]; // 视图字段过滤器，用于控制返回的字段
}

// 创建仓库 - 请求
message CreateWarehouseRequest {
  Warehouse data = 1;
}

// 更新仓库 - 请求
message UpdateWarehouseRequest {
  uint32 id = 1;

  Warehouse data = 2;

  google.protobuf.FieldMask update_mask = 3 [
    (gnostic.openapi.v3.property) = {
          description: "要更新的字段列表",
          example: {yaml : "id,realname,username"}
        },
    json_name = "updateMask"
  ]; // 要更新的字段列表

  optional bool allow_missing = 4 [
    (gnostic.openapi.v3.property) = {description: "如果设置为true的时候，资源不存在则会新增(插入)，并且在这种情况下`updateMask`字段将会被忽略。"},
    json_name = "allowMissing"
  ]; // 如果设置为true的时候，资源不存在则会新增(插入)，并且在这种情况下`updateMask`字段将会被忽略。
}

// 删除仓库 - 请求
message DeleteWarehouseRequest {
  oneof query_by {
    uint32 id = 1 [
      (gnostic.openapi.v3.property) = {description: "ID", read_only: true},
      json_name = "id"
    ]; // ID
  }
}

message CountWarehouseResponse {
  uint64 count = 1;
}

// =========== Location ==========

message ListLocationResponse {
  repeated StockLocation items = 1;
  uint64 total = 2;
}

message GetLocationRequest {
  oneof query_by {
    uint32 id = 1 [
      (gnostic.openapi.v3.property) = {description: "ID", read_only: true},
      json_name = "id"
    ]; // ID
  }

  optional google.protobuf.FieldMask view_mask = 100 [
    json_name = "viewMask",
    (gnostic.openapi.v3.property) = {
          description: "视图字段过滤器，用于控制返回的字段"
        }
  ]; // 视图字段过滤器，用于控制返回的字段
}

message CreateLocationRequest {
  StockLocation data = 1;
}

message UpdateLocationRequest {
  uint32 id = 1;

  StockLocation data = 2;

  google.protobuf.FieldMask update_mask = 3 [
    (gnostic.openapi.v3.property) = {
          description: "要更新的字段列表",
          example: {yaml : "id,realname,username"}
        },
    json_name = "updateMask"
  ]; // 要更新的字段列表

  optional bool allow_missing = 4 [
