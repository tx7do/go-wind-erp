syntax = "proto3";

package product.service.v1;

import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";
import "pagination/v1/pagination.proto";

// 商品（SKU）主数据服务
service ProductService {
  rpc List (pagination.PagingRequest) returns (ListProductResponse) {}
  rpc Count (pagination.PagingRequest) returns (CountProductResponse) {}
  rpc Get (GetProductRequest) returns (Product) {}
  rpc Create (CreateProductRequest) returns (google.protobuf.Empty) {}
  rpc Update (UpdateProductRequest) returns (google.protobuf.Empty) {}
  rpc Delete (DeleteProductRequest) returns (google.protobuf.Empty) {}
}

// 商品（SKU）
message Product {
  optional uint32 id = 1 [
    json_name = "id",
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {description: "商品ID"}
  ];
  optional string code = 2 [
    json_name = "code",
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {description: "SKU编码，租户范围内唯一"}
  ];
  optional string name = 3 [
    json_name = "name",
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {description: "商品名称"}
  ];
  optional string spec = 4 [
    json_name = "spec",
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {description: "规格"}
  ];
  optional string unit = 5 [
    json_name = "unit",
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {description: "单位"}
  ];
  optional bool enable = 10 [
    json_name = "enable",
    (gnostic.openapi.v3.property) = {description: "启用/禁用"}
  ];
  optional string remark = 11 [
    json_name = "remark",
    (gnostic.openapi.v3.property) = {description: "备注"}
  ];
  optional uint32 tenant_id = 20 [
    json_name = "tenantId",
    (gnostic.openapi.v3.property) = {description: "租户ID"}
  ];
  optional uint32 created_by = 100 [json_name = "createdBy", (gnostic.openapi.v3.property) = {description: "创建者用户ID"}];
  optional uint32 updated_by = 101 [json_name = "updatedBy", (gnostic.openapi.v3.property) = {description: "更新者用户ID"}];
  optional uint32 deleted_by = 102 [json_name = "deletedBy", (gnostic.openapi.v3.property) = {description: "删除者用户ID"}];
  optional google.protobuf.Timestamp created_at = 200 [json_name = "createdAt", (gnostic.openapi.v3.property) = {description: "创建时间"}];
  optional google.protobuf.Timestamp updated_at = 201 [json_name = "updatedAt", (gnostic.openapi.v3.property) = {description: "更新时间"}];
  optional google.protobuf.Timestamp deleted_at = 202 [json_name = "deletedAt", (gnostic.openapi.v3.property) = {description: "删除时间"}];
}

message ListProductResponse {
  repeated Product items = 1;
  uint64 total = 2;
}

message GetProductRequest {
  oneof query_by {
    uint32 id = 1 [
      (gnostic.openapi.v3.property) = {description: "ID", read_only: true},
      json_name = "id"
    ];
  }
  optional google.protobuf.FieldMask view_mask = 100 [json_name = "viewMask", (gnostic.openapi.v3.property) = {description: "视图字段过滤器"}];
}

message CreateProductRequest {
  Product data = 1;
}

message UpdateProductRequest {
  uint32 id = 1;
  Product data = 2;
  google.protobuf.FieldMask update_mask = 3 [
    (gnostic.openapi.v3.property) = {description: "要更新的字段列表"},
    json_name = "updateMask"
  ];
  optional bool allow_missing = 4 [
    (gnostic.openapi.v3.property) = {description: "资源不存在则新增"},
    json_name = "allowMissing"
  ];
}

message DeleteProductRequest {
  oneof query_by {
    uint32 id = 1 [
      (gnostic.openapi.v3.property) = {description: "ID", read_only: true},
      json_name = "id"
    ];
  }
}

message CountProductResponse {
  uint64 count = 1;
}
