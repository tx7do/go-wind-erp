syntax = "proto3";

package admin.service.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

import "pagination/v1/pagination.proto";
import "product/service/v1/product.proto";

// 商品（SKU）主数据管理服务
service ProductService {
  rpc List (pagination.PagingRequest) returns (product.service.v1.ListProductResponse) {
    option (google.api.http) = { get: "/admin/v1/products" };
  }

  rpc Get (product.service.v1.GetProductRequest) returns (product.service.v1.Product) {
    option (google.api.http) = { get: "/admin/v1/products/{id}" };
  }

  rpc Create (product.service.v1.CreateProductRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/admin/v1/products"
      body: "*"
    };
  }

  rpc Update (product.service.v1.UpdateProductRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/admin/v1/products/{id}"
      body: "*"
    };
  }

  rpc Delete (product.service.v1.DeleteProductRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { delete: "/admin/v1/products/{id}" };
  }
}
