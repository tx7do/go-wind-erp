syntax = "proto3";

package admin.service.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

import "pagination/v1/pagination.proto";
import "finance/service/v1/finance.proto";

// 应付单管理服务
service PayableService {
  // 查询应付单列表
  rpc List (pagination.PagingRequest) returns (finance.service.v1.ListPayableResponse) {
    option (google.api.http) = {
      get: "/admin/v1/payables"
    };
  }

  // 查询应付单详情
  rpc Get (finance.service.v1.GetPayableRequest) returns (finance.service.v1.Payable) {
    option (google.api.http) = {
      get: "/admin/v1/payables/{id}"
    };
  }

  // 创建应付单（手工建账）
  rpc Create (finance.service.v1.CreatePayableRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/admin/v1/payables"
      body: "*"
    };
  }

  // 删除应付单（仅 PENDING 且未付款）
  rpc Delete (finance.service.v1.DeletePayableRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/admin/v1/payables/{id}"
    };
  }

  // 取消应付单（仅 PENDING 且未付款）
  rpc Cancel (finance.service.v1.CancelPayableRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/admin/v1/payables:cancel"
      body: "*"
    };
  }

  // 应付账龄报表
  rpc AgingReport (google.protobuf.Empty) returns (finance.service.v1.AgingReportResponse) {
    option (google.api.http) = {
      get: "/admin/v1/payables:aging-report"
    };
  }
}

// 付款管理服务（append-only 台账）
service PaymentService {
  // 查询付款列表
  rpc List (pagination.PagingRequest) returns (finance.service.v1.ListPaymentResponse) {
    option (google.api.http) = {
      get: "/admin/v1/payments"
    };
  }

  // 查询付款详情
  rpc Get (finance.service.v1.GetPaymentRequest) returns (finance.service.v1.Payment) {
    option (google.api.http) = {
      get: "/admin/v1/payments/{id}"
    };
  }

  // 记录付款
  rpc Create (finance.service.v1.CreatePaymentRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/admin/v1/payments"
      body: "*"
    };
  }
}

// 应收单管理服务（镜像 PayableService）
service ReceivableService {
  rpc List (pagination.PagingRequest) returns (finance.service.v1.ListReceivableResponse) {
    option (google.api.http) = {
      get: "/admin/v1/receivables"
    };
  }

  rpc Get (finance.service.v1.GetReceivableRequest) returns (finance.service.v1.Receivable) {
    option (google.api.http) = {
      get: "/admin/v1/receivables/{id}"
    };
  }

  rpc Create (finance.service.v1.CreateReceivableRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/admin/v1/receivables"
      body: "*"
    };
  }

  rpc Delete (finance.service.v1.DeleteReceivableRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/admin/v1/receivables/{id}"
    };
  }

  rpc Cancel (finance.service.v1.CancelReceivableRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/admin/v1/receivables:cancel"
      body: "*"
    };
  }

  rpc AgingReport (google.protobuf.Empty) returns (finance.service.v1.AgingReportResponse) {
    option (google.api.http) = {
      get: "/admin/v1/receivables:aging-report"
    };
  }
}

// 收款管理服务（append-only 台账，镜像 PaymentService）
service ReceiptService {
  rpc List (pagination.PagingRequest) returns (finance.service.v1.ListReceiptResponse) {
    option (google.api.http) = {
      get: "/admin/v1/receipts"
    };
  }

  rpc Get (finance.service.v1.GetReceiptRequest) returns (finance.service.v1.Receipt) {
    option (google.api.http) = {
      get: "/admin/v1/receipts/{id}"
    };
  }

  rpc Create (finance.service.v1.CreateReceiptRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/admin/v1/receipts"
      body: "*"
    };
  }
}

// 财务报表服务
service FinanceReportService {
  rpc ProfitReport (google.protobuf.Empty) returns (finance.service.v1.ProfitReportResponse) {
    option (google.api.http) = {
      get: "/admin/v1/finance/profit-report"
    };
  }

  // 经营汇总（驾驶舱：本月收入/成本/利润 + 应收应付余额）
  rpc GetFinanceSummary (google.protobuf.Empty) returns (finance.service.v1.FinanceSummaryResponse) {
    option (google.api.http) = {
      get: "/admin/v1/finance/summary"
    };
  }
}

// 会计服务（简易总账：科目/凭证/余额表，只读查询）
service AccountingService {
  // 科目目录
  rpc ListAccounts (pagination.PagingRequest) returns (finance.service.v1.ListAccountResponse) {
    option (google.api.http) = {
      get: "/admin/v1/accounts"
    };
  }

  // 凭证流水（含分录行）
  rpc ListJournalEntries (finance.service.v1.ListJournalEntryRequest) returns (finance.service.v1.ListJournalEntryResponse) {
    option (google.api.http) = {
      get: "/admin/v1/journal-entries"
    };
  }

  // 科目余额表（试算平衡）
  rpc GetTrialBalance (finance.service.v1.GetTrialBalanceRequest) returns (finance.service.v1.TrialBalanceResponse) {
    option (google.api.http) = {
      get: "/admin/v1/trial-balance"
    };
  }
}
