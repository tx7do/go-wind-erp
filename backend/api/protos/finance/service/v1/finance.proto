  ]; // 科目类别

  optional string balance_direction = 4 [
    json_name = "balanceDirection",
    (gnostic.openapi.v3.property) = {description: "余额方向"}
  ]; // 余额方向

  optional int64 debit_total = 5 [
    json_name = "debitTotal",
    (gnostic.openapi.v3.property) = {description: "借方累计（分）"}
