                sizeFormat:
                    example: 2.3 MB
                    type: string
                    description: 格式化后的文件长度字符串
                linkUrl:
                    type: string
                    description: 链接地址
                contentHash:
                    type: string
                    description: 文件内容hash值
                tenantId:
                    type: string
                    description: 租户ID，0代表系统全局角色
                tenantName:
                    type: string
                    description: 租户名称
                createdBy:
                    type: string
                    description: 创建者用户ID
                updatedBy:
                    type: string
                    description: 更新者用户ID
                deletedBy:
                    type: string
                    description: 删除者用户ID
                createdAt:
                    type: string
                    description: 创建时间
                    format: date-time
                updatedAt:
                    type: string
                    description: 更新时间
                    format: date-time
                deletedAt:
                    type: string
                    description: 删除时间
                    format: date-time
            description: 文件
        storage.service.v1.ListFileResponse:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/storage.service.v1.File'
                total:
                    type: string
            description: 查询列表 - 回应
        storage.service.v1.PresignOption:
            type: object
            properties:
                method:
                    type: string
                    description: 预签名使用的 HTTP 方法，例如 PUT 或 POST
                expireSeconds:
                    type: integer
                    description: 预签名有效期（秒）
                    format: int32
                contentType:
                    type: string
                    description: 预签名约束的 Content-Type（可选）
            description: 预签名选项
        storage.service.v1.StorageObject:
            type: object
            properties:
                bucketName:
                    type: string
                    description: 目标文件桶名称
                fileDirectory:
                    example: tenant/1001/user/avatar/
                    type: string
                    description: 存储目录（如 'user/1001/avatar/'），服务端会在此目录下生成唯一文件名
                objectName:
                    example: user/1001/avatar.jpg
                    type: string
                    description: OSS 对象键（完整路径，如 'user/1001/avatar.jpg'）。若未提供，服务端将自动生成。
            description: 对象存储对象
        storage.service.v1.UpdateFileRequest:
            type: object
            properties:
                id:
                    type: string
                data:
                    $ref: '#/components/schemas/storage.service.v1.File'
                updateMask:
                    example: id,realname,username
                    type: string
                    description: 要更新的字段列表
                    format: field-mask
                allowMissing:
                    type: boolean
                    description: 如果设置为true的时候，资源不存在则会新增(插入)，并且在这种情况下`updateMask`字段将会被忽略。
            description: 更新 - 请求
        storage.service.v1.UploadFileRequest:
            type: object
            properties:
                storageObject:
                    $ref: '#/components/schemas/storage.service.v1.StorageObject'
                file:
                    type: string
                    description: 直接上传的文件内容（内联字节）
                    format: bytes
                presign:
                    $ref: '#/components/schemas/storage.service.v1.PresignOption'
                sourceFileName:
                    type: string
                    description: 原文件文件名
                mime:
                    type: string
                    description: 文件的MIME类型
                size:
                    type: string
                    description: 文件大小（字节）
                tenantId:
                    type: string
                    description: 租户ID，0代表系统全局角色
                userId:
                    type: string
                    description: 用户ID
        storage.service.v1.UploadFileResponse:
            type: object
            properties:
                objectName:
                    type: string
                    description: OSS 对象键
                presignedUrl:
                    type: string
                    description: 预签名上传链接
        task.service.v1.ControlTaskRequest:
            type: object
            properties:
                controlType:
                    enum:
                        - Start
                        - Stop
                        - Restart
                    type: string
                    description: 控制类型
                    format: enum
                typeName:
                    type: string
                    description: 任务执行类型名，例如 "send_email"、"generate_report" 等，用于区分不同类型的任务
            description: 控制调度任务 - 请求
        task.service.v1.CreateTaskRequest:
            type: object
            properties:
                data:
                    $ref: '#/components/schemas/task.service.v1.Task'
            description: 创建调度任务 - 请求
        task.service.v1.ListTaskResponse:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/task.service.v1.Task'
                total:
                    type: string
            description: 查询调度任务列表 - 回应
        task.service.v1.ListTaskTypeNameResponse:
            type: object
            properties:
                typeNames:
                    type: array
                    items:
                        type: string
                    description: 类型名称列表
            description: 任务类型名称列表 - 回应
        task.service.v1.RestartAllTaskResponse:
            type: object
            properties:
                count:
                    type: integer
                    format: int32
            description: 重启调度任务 - 回应
        task.service.v1.Task:
            type: object
            properties:
                id:
                    type: string
                    description: 任务ID
                type:
                    enum:
                        - PERIODIC
                        - DELAY
                        - WAIT_RESULT
                    type: string
                    description: 任务类型
                    format: enum
                typeName:
                    type: string
                    description: 任务执行类型名，例如 "send_email"、"generate_report" 等，用于区分不同类型的任务
                taskPayload:
                    type: string
                    description: 任务数据，以 JSON 格式存储，方便存储不同类型和数量的参数
                cronSpec:
                    type: string
                    description: cron表达式，用于定义任务的调度时间
                taskOptions:
                    $ref: '#/components/schemas/task.service.v1.TaskOption'
                enable:
                    type: boolean
                    description: 启用/禁用任务
                remark:
                    type: string
                    description: 备注
                tenantId:
                    type: string
                    description: 租户ID，0代表系统全局角色
                createdBy:
                    type: string
                    description: 创建者用户ID
                updatedBy:
                    type: string
                    description: 更新者用户ID
                deletedBy:
                    type: string
                    description: 删除者用户ID
                createdAt:
                    type: string
                    description: 创建时间
                    format: date-time
                updatedAt:
                    type: string
                    description: 更新时间
                    format: date-time
                deletedAt:
                    type: string
                    description: 删除时间
                    format: date-time
            description: 调度任务
        task.service.v1.TaskOption:
            type: object
            properties:
                maxRetry:
                    type: integer
                    description: 任务最多可以重试的次数
                    format: uint32
                timeout:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                    description: 任务超时时间
                deadline:
                    type: string
                    description: 任务截止时间
                    format: date-time
                processIn:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                    description: 任务延迟处理时间
                processAt:
                    type: string
                    description: 任务执行时间点
                    format: date-time
                uniqueTTL:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                    description: 任务唯一锁定时间
                retention:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                    description: 任务结果保留时间
                group:
                    type: string
                    description: 任务分组
                taskID:
                    type: string
                    description: 任务唯一标识ID
            description: 任务选项
        task.service.v1.UpdateTaskRequest:
            type: object
            properties:
                id:
                    type: string
                data:
                    $ref: '#/components/schemas/task.service.v1.Task'
                updateMask:
                    example: id,realname,username
                    type: string
                    description: 要更新的字段列表
                    format: field-mask
                allowMissing:
                    type: boolean
                    description: 如果设置为true的时候，资源不存在则会新增(插入)，并且在这种情况下`updateMask`字段将会被忽略。
            description: 更新调度任务 - 请求
    responses:
        default:
            description: default kratos response
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/KratosStatus'
    securitySchemes:
        OAuth2PasswordBearer:
            type: oauth2
            flows:
                password:
                    tokenUrl: /admin/v1/login
                    refreshUrl: /admin/v1/refresh-token
                    scopes: {}
security:
    - OAuth2PasswordBearer: []
