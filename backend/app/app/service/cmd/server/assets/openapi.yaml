                    type: string
                    description: 目标文件桶名称
                fileDirectory:
                    example: tenant/1001/user/avatar/
                    type: string
                    description: 存储目录（如 'user/1001/avatar/'），服务端会在此目录下生成唯一文件名
                objectName:
                    example: user/1001/avatar.jpg
                    type: string
                    description: OSS 对象键（完整路径，如 'user/1001/avatar.jpg'）。若未提供，服务端将自动生成。
            description: 对象存储对象
        storage.service.v1.UploadFileRequest:
            type: object
            properties:
                storageObject:
                    $ref: '#/components/schemas/storage.service.v1.StorageObject'
                file:
                    type: string
                    description: 直接上传的文件内容（内联字节）
                    format: bytes
                presign:
                    $ref: '#/components/schemas/storage.service.v1.PresignOption'
                sourceFileName:
                    type: string
                    description: 原文件文件名
                mime:
                    type: string
                    description: 文件的MIME类型
                size:
                    type: string
                    description: 文件大小（字节）
                tenantId:
                    type: integer
                    description: 租户ID，0代表系统全局角色
                    format: uint32
                userId:
                    type: integer
                    description: 用户ID
                    format: uint32
        storage.service.v1.UploadFileResponse:
            type: object
            properties:
                objectName:
                    type: string
                    description: OSS 对象键
                presignedUrl:
                    type: string
                    description: 预签名上传链接
    responses:
        default:
            description: default kratos response
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/KratosStatus'
    securitySchemes:
        OAuth2PasswordBearer:
            type: oauth2
            flows:
                password:
                    tokenUrl: /admin/v1/login
                    refreshUrl: /admin/v1/refresh-token
                    scopes: {}
security:
    - OAuth2PasswordBearer: []
tags:
    - name: ApprovalRequestService
      description: 审批中心服务（移动端：待办列表 + 通过/驳回/撤销；不暴露创建/删除）
    - name: AuthenticationService
      description: 用户前台登录认证服务
    - name: FileTransferService
      description: 文件传输服务
    - name: InventoryService
      description: 库存服务（移动端只读：按仓库/SKU 查询库存）
    - name: PurchaseOrderService
      description: |-
        采购单服务（移动端只读：审批人在审批中心看到采购审批后可查单据原文；
         发起与维护在 PC 端完成）
    - name: StockMovementService
      description: 库存流水服务（移动端：扫码记录出入库流水）
    - name: UserProfileService
      description: 用户个人资料服务
    - name: WarehouseService
      description: 仓库服务（移动端只读：扫码场景选择仓库）
