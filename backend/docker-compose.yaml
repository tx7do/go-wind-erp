  redis:
    image: docker.io/library/redis:8.2-alpine
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - app-tier
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-*Abcd123456}
      - TZ=Asia/Shanghai
    volumes:
      - ${APP_ROOT:-/root/app}/redis/data:/data
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-*Abcd123456}"]
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: docker.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: always
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    networks:
      - app-tier
    environment:
      - MINIO_ROOT_USER=root
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-*Abcd123456}
      - TZ=Asia/Shanghai
    volumes:
      - ${APP_ROOT:-/root/app}/minio/data:/data
    command: server /data --console-address ':9001'
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

