  etcd:
    image: quay.io/coreos/etcd:v3.6.8
    restart: always
    ports:
      - "127.0.0.1:2379:2379"
      - "127.0.0.1:2380:2380"
    networks:
      - app-tier
    environment:
      - ETCDCTL_API=3
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://etcd:2380
      - ETCD_INITIAL_CLUSTER=default=http://etcd:2380
      - ETCD_INITIAL_CLUSTER_TOKEN=etcd-cluster-token
      - ETCD_INITIAL_CLUSTER_STATE=new
      - ETCD_NAME=default
      - TZ=Asia/Shanghai
    volumes:
      - ${APP_ROOT:-/root/app}/etcd/data:/default.etcd
    healthcheck:
      test: ["CMD-SHELL", "etcdctl --endpoints=http://127.0.0.1:2379 endpoint health"]
      interval: 5s
      timeout: 5s
      retries: 12

  jaeger:
    image: docker.io/jaegertracing/all-in-one:1.76.0
    restart: always
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:16686:16686"
    networks:
      - app-tier
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
      - COLLECTOR_OTLP_ENABLED=true

  # 容器内的配置要点（与宿主机运行的默认 configs 不同）：
  # - registry/oss/trace 用容器网络服务名，通过挂载 backend/deploy/compose/*.yaml 覆盖
  # - data.yaml / asynq 默认已是 postgres/redis 服务名，无需覆盖
  # - oss 的 upload_host/download_host 是给浏览器/App 用的，上公网前必须改为公网地址
  #   （见 docs/deployment.md 第 5.2 节）
  admin-service:
    image: go-wind-erp/admin-service:1.0.0
    restart: always
    pull_policy: never
    profiles: ["app"]
    networks:
      - app-tier
    ports:
      - "6600:6600"
      - "6601:6601"
    volumes:
      - ./deploy/compose/registry.yaml:/app/configs/registry.yaml:ro
      - ./deploy/compose/oss.yaml:/app/configs/oss.yaml:ro
      - ./deploy/compose/trace.yaml:/app/configs/trace.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      etcd:
        condition: service_healthy
      jaeger:
        condition: service_started
    environment:
      - TZ=Asia/Shanghai
    build:
      context: ./  # 指定 Dockerfile 所在的上下文路径
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: admin
        APP_VERSION: 1.0.0

  app-service:
    image: go-wind-erp/app-service:1.0.0
    restart: always
    pull_policy: never
    profiles: ["app"]
    networks:
      - app-tier
    ports:
      - "6700:6700"
      - "6701:6701"
    volumes:
      - ./deploy/compose/registry.yaml:/app/configs/registry.yaml:ro
      - ./deploy/compose/oss.yaml:/app/configs/oss.yaml:ro
      - ./deploy/compose/trace.yaml:/app/configs/trace.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      etcd:
        condition: service_healthy
      jaeger:
        condition: service_started
    environment:
      - TZ=Asia/Shanghai
    build:
      context: ./  # 指定 Dockerfile 所在的上下文路径
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: app
        APP_VERSION: 1.0.0

  core-service:
    image: go-wind-erp/core-service:1.0.0
    pull_policy: never
    restart: always
    profiles: ["app"]
    networks:
      - app-tier
    volumes:
      - ./deploy/compose/registry.yaml:/app/configs/registry.yaml:ro
      - ./deploy/compose/oss.yaml:/app/configs/oss.yaml:ro
      - ./deploy/compose/trace.yaml:/app/configs/trace.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      etcd:
        condition: service_healthy
      jaeger:
        condition: service_started
    environment:
      - TZ=Asia/Shanghai
    build:
      context: ./  # 指定 Dockerfile 所在的上下文路径
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: core
        APP_VERSION: 1.0.0
