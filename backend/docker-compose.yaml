networks:
  app-tier:
    driver: bridge

# 约定：
# - 依赖容器端口默认只绑定 127.0.0.1（生产更安全；路径 A 宿主机服务/路径 B 反代都走本机回环）
# - 数据持久化到 ${APP_ROOT}（默认 /root/app，可用环境变量覆盖），容器重建不丢数据
# - 依赖镜像均已固定版本
# - 三个应用服务在 "app" profile 中：默认 up 只起依赖（供 PM2 宿主机部署使用）；
#   全容器化部署用 `docker compose --profile app up -d`
services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - app-tier
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-*Abcd123456}
      - POSTGRES_DB=go_wind_erp
      - TZ=Asia/Shanghai
    volumes:
      - ${APP_ROOT:-/root/app}/postgres/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d go_wind_erp"]
      interval: 5s
      timeout: 3s
      retries: 12
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

