name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (build / vet / test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Build
        run: go build ./app/core/service/... ./app/admin/service/... ./app/app/service/...
      - name: Vet
        run: go vet ./app/core/service/... ./app/admin/service/... ./app/app/service/...
      - name: Test
        run: go test ./app/core/service/internal/service/... ./app/core/service/internal/data/ -run 'TestStatusTransition|TestApprovalTransition|TestPurchaseOrderTransition|TestPayableTransition|TestAddChecked|TestAddOverflow|TestMulChecked|TestInventoryQuantityAtomicity|TestSumQuantityEmptyTableLocked'

  admin:
    name: Admin frontend (typecheck / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/admin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/admin/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck --filter @vben/web-antd
        working-directory: frontend/admin/apps/admin
      - run: pnpm build
        working-directory: frontend/admin/apps/admin
        env:
          CI: true

  flutter:
    name: Flutter app (analyze / test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/app/flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
